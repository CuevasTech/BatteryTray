name: Store package

# Al subir una etiqueta de versión (git tag v0.2.0 && git push origin v0.2.0):
# - pasa las pruebas,
# - genera el paquete para la Microsoft Store (x64 + ARM64 en un .msixbundle) y lo deja
#   como artefacto descargable del flujo, para subirlo a Partner Center,
# - crea la página de novedades de la versión en GitHub (sin ejecutables: la app se
#   distribuye solo por la Microsoft Store).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (X.Y.Z)'
        required: true

permissions:
  contents: write # para crear la página de la versión

jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Se pasan como variables de entorno (no interpoladas en los scripts)
      # para evitar inyección de comandos a través del nombre de la etiqueta.
      TAG: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $v = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:TAG.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versión no válida: $v" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Pruebas
        run: |
          dotnet test --project tests/BatteryTray.Core.Tests/BatteryTray.Core.Tests.csproj
          dotnet test --project tests/BatteryTray.Windows.Tests/BatteryTray.Windows.Tests.csproj -p:Platform=x64

      - name: Paquete para la Store
        shell: pwsh
        run: ./tools/Pack-Store.ps1 -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryTray-${{ steps.version.outputs.value }}-store
          path: artifacts/store/*.msixbundle
          if-no-files-found: error
          retention-days: 90

      - name: Página de la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-notes/$env:TAG.md"
          $ghArgs = @($env:TAG, '--title', "BatteryTray $env:TAG")
          $ghArgs += if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          if ($env:TAG -match '^v0\.') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
