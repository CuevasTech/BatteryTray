name: Release

# Se lanza al subir una etiqueta de versión, por ejemplo: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # necesario para crear la release y subir los ZIP

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # La etiqueta se pasa como variable de entorno (no interpolada en el script)
      # para evitar inyección de comandos a través del nombre de la etiqueta.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validar la etiqueta
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Etiqueta no válida: $env:TAG" }

      - name: Pruebas
        run: |
          dotnet test --project tests/BatteryTray.Core.Tests/BatteryTray.Core.Tests.csproj
          dotnet test --project tests/BatteryTray.Windows.Tests/BatteryTray.Windows.Tests.csproj -p:Platform=x64

      - name: Publicar x64 y ARM64
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $numeric = $version.Split('-')[0]
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            $platform = if ($arch -eq 'x64') { 'x64' } else { 'ARM64' }
            $out = "artifacts/BatteryTray-win-$arch"
            dotnet publish src/BatteryTray.App/BatteryTray.App.csproj -c Release -r "win-$arch" -p:Platform=$platform `
              -p:Version=$numeric -p:InformationalVersion=$version -o $out
            if ($LASTEXITCODE -ne 0) { throw "Falló la publicación de $arch" }
            Compress-Archive -Path "$out/*" -DestinationPath "artifacts/BatteryTray-$version-win-$arch.zip"
          }
          # Sumas SHA-256 para que cualquiera pueda comprobar que la descarga no se ha alterado.
          Get-ChildItem artifacts/*.zip | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Crear la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-notes/$env:TAG.md"
          # PowerShell no expande comodines al llamar a programas externos: se pasan las rutas reales.
          $files = @((Get-ChildItem artifacts/*.zip).FullName) + (Resolve-Path artifacts/SHA256SUMS.txt).Path
          $ghArgs = @($env:TAG) + $files + @('--title', "BatteryTray $env:TAG")
          $ghArgs += if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          # Las versiones 0.x se marcan como preliminares.
          if ($env:TAG -match '^v0\.' -or $env:TAG -match '-') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
