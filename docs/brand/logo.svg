<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>BatteryTray</title>
  <!--
    Logo de BatteryTray: tres baterías como la de Windows 11 (borde claro, hueco y relleno),
    cada una con el color de un dispositivo, abiertas en abanico.
    Sin filtros SVG para que se vea igual en cualquier programa.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303B5C"/>
      <stop offset="1" stop-color="#141A2C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D3E6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE7FF"/>
      <stop offset="1" stop-color="#2E8BFF"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4CBFF"/>
      <stop offset="1" stop-color="#8A5BFF"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD89A"/>
      <stop offset="1" stop-color="#FF7B3A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sombra suave bajo el conjunto -->
  <ellipse cx="118" cy="224" rx="96" ry="15" fill="url(#shadow)"/>

  <!-- Batería de atrás (naranja) -->
  <g transform="translate(30 -66) rotate(-21 128 136)">
    <rect x="44" y="98" width="152" height="78" rx="22" fill="url(#body)" stroke="url(#rim)" stroke-width="9"/>
    <rect x="200" y="120" width="11" height="34" rx="5" fill="url(#rim)"/>
    <rect x="61" y="115" width="122" height="44" rx="9" fill="url(#orange)"/>
  </g>

  <!-- Batería del medio (morada) -->
  <g transform="translate(13 -30) rotate(-10 128 136)">
    <rect x="44" y="98" width="152" height="78" rx="22" fill="url(#body)" stroke="url(#rim)" stroke-width="9"/>
    <rect x="200" y="120" width="11" height="34" rx="5" fill="url(#rim)"/>
    <rect x="61" y="115" width="112" height="44" rx="9" fill="url(#purple)"/>
  </g>

  <!-- Batería delantera (azul) -->
  <g transform="translate(-10 36)">
    <rect x="44" y="98" width="152" height="78" rx="22" fill="url(#body)" stroke="url(#rim)" stroke-width="9"/>
    <rect x="200" y="120" width="11" height="34" rx="5" fill="url(#rim)"/>
    <rect x="61" y="115" width="106" height="44" rx="9" fill="url(#blue)"/>
    <rect x="61" y="115" width="106" height="20" rx="9" fill="url(#gloss)"/>
  </g>
</svg>
