<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>BatteryTray</title>
  <!-- Versión simplificada para tamaños pequeños (16-47 px): solo la batería delantera. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303B5C"/>
      <stop offset="1" stop-color="#141A2C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE7FF"/>
      <stop offset="1" stop-color="#2E8BFF"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="8.5" width="26" height="15" rx="4" fill="url(#body)" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="28.5" y="13" width="2" height="6" rx="1" fill="#FFFFFF"/>
  <rect x="4.5" y="11.5" width="16" height="9" rx="1.5" fill="url(#blue)"/>
</svg>
